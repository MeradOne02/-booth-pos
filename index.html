<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>บันทึกยอดขายหน้าบูธ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#211b17;
    --surface:#2c2420;
    --surface-2:#382e28;
    --edge:#4a3d34;
    --text:#f4ede2;
    --muted:#b3a292;
    --gold:#e3a23c;
    --gold-dim:#5c4526;
    --lime:#96c23f;
    --lime-dim:#3f4b26;
    --chili:#d6553f;
    --chili-dim:#5a3128;
    --good:#7fbf6a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(227,162,60,0.10), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(150,194,63,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Kanit',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 0;}

  /* Header / ticket */
  .ticket{
    background:var(--surface);
    border:1px solid var(--edge);
    border-radius:14px;
    padding:18px 20px;
    position:relative;
    overflow:hidden;
  }
  .ticket::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 8px);
    pointer-events:none;
  }
  .shop-title{
    font-weight:800; font-size:22px; letter-spacing:0.3px;
    display:flex; align-items:center; gap:8px;
  }
  .coin{
    width:26px;height:26px;border-radius:50%;
    background:linear-gradient(145deg,var(--gold),#b9782a);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#2c1c07;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25);
    flex-shrink:0;
  }
  .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .today-row{
    display:flex; gap:10px; margin-top:16px;
  }
  .stat{
    flex:1; background:var(--surface-2); border-radius:10px; padding:12px 14px;
    border:1px solid var(--edge);
  }
  .stat .label{font-size:12px;color:var(--muted);}
  .stat .value{font-size:24px;font-weight:700;margin-top:2px;}
  .stat.money .value{color:var(--gold);}
  .stat.count .value{color:var(--lime);}

  .status-line{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);margin-top:10px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .dot.ok{background:var(--good);}
  .dot.err{background:var(--chili);}
  .pending-pill{
    background:var(--gold-dim); color:var(--gold);
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
    display:none; align-items:center; gap:5px;
  }
  .pending-pill.show{display:inline-flex;}
  .pending-pill .spin{
    width:8px;height:8px;border-radius:50%;
    border:2px solid var(--gold); border-top-color:transparent;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .settings-btn{
    background:none;border:1px solid var(--edge);color:var(--muted);
    font-family:'Kanit',sans-serif; font-size:12px;
    border-radius:20px; padding:4px 12px; cursor:pointer; margin-left:auto;
  }
  .settings-btn:active{background:var(--surface-2);}

  /* Menu grid */
  h2.section-label{
    font-size:13px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px;
    margin:22px 4px 10px;
  }
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .item-btn{
    border:none; border-radius:14px; padding:0;
    text-align:left; cursor:pointer; position:relative;
    font-family:'Kanit',sans-serif; color:#fff;
    display:block; min-height:128px; overflow:hidden;
    background-size:cover; background-position:center;
    transition:transform .08s ease;
    -webkit-tap-highlight-color:transparent;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .item-btn:active{transform:scale(0.96);}
  .item-btn.wide{grid-column:1 / -1; min-height:110px;}
  .item-btn .tag{
    position:absolute; top:9px; left:9px;
    width:9px; height:9px; border-radius:50%;
    box-shadow:0 0 0 2px rgba(0,0,0,0.35);
  }
  .item-btn.cat-chicken .tag{background:var(--gold);}
  .item-btn.cat-drink .tag{background:var(--lime);}
  .item-btn.cat-spice .tag{background:var(--chili);}
  .item-btn .overlay-grad{
    position:absolute; inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.35) 48%, rgba(0,0,0,0.05) 75%);
  }
  .item-btn .content{
    position:absolute; left:0; right:0; bottom:0; padding:12px 14px;
    display:flex; flex-direction:column; gap:2px;
  }
  .item-btn .name{font-weight:600; font-size:14.5px; line-height:1.25; text-shadow:0 1px 3px rgba(0,0,0,0.6);}
  .item-btn .price{font-weight:800; font-size:19px; text-shadow:0 1px 3px rgba(0,0,0,0.6);}
  .item-btn .price::after{content:" ฿";font-size:12.5px;font-weight:600;opacity:.85;}

  .pop{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:var(--good); color:#12310a; font-weight:700; font-size:14px;
    padding:10px 20px; border-radius:30px; opacity:0;
    transition:all .25s ease; pointer-events:none; z-index:50;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    white-space:nowrap;
  }
  .pop.show{opacity:1; transform:translate(-50%,0);}
  .pop.err{background:var(--chili); color:#3a0f08;}

  /* Log */
  .log-header{
    display:flex; align-items:center; justify-content:flex-end;
    margin:22px 4px 10px; gap:10px;
  }
  .log-header h2{margin:0;}
  .delete-btn{
    background:var(--chili-dim); color:#ffd9cf; border:1px solid var(--chili);
    font-family:'Kanit',sans-serif; font-size:12.5px; font-weight:600;
    border-radius:20px; padding:5px 14px; cursor:pointer;
    display:none; align-items:center; gap:6px;
  }
  .delete-btn.show{display:inline-flex;}
  .delete-btn:active{opacity:0.7;}
  .log{
    background:var(--surface); border:1px solid var(--edge); border-radius:14px;
    padding:6px 4px; margin-top:8px;
  }
  .log-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; border-bottom:1px dashed var(--edge);
    font-size:13.5px;
  }
  .log-row:last-child{border-bottom:none;}
  .log-row input[type="checkbox"]{
    width:18px; height:18px; flex-shrink:0; accent-color:var(--chili);
    cursor:pointer;
  }
  .log-row .checkbox-spacer{width:18px;flex-shrink:0;}
  .log-row .time{color:var(--muted); width:40px; flex-shrink:0; font-variant-numeric:tabular-nums;}
  .log-row .lname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .log-row .lprice{color:var(--gold); font-weight:600; flex-shrink:0;}
  .log-row.checked{background:rgba(214,85,63,0.12);}
  .log-row.pending{opacity:0.65;}
  .log-row .sync-spin{
    width:12px;height:12px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--gold); border-top-color:transparent;
    animation:spin 0.8s linear infinite;
  }
  .empty{padding:22px 14px; color:var(--muted); font-size:13.5px; text-align:center;}

  /* Settings modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface); border:1px solid var(--edge);
    border-radius:18px 18px 0 0; padding:20px; width:100%; max-width:640px;
  }
  .modal h3{margin:0 0 6px; font-size:17px;}
  .modal p{color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 12px;}
  .modal input{
    width:100%; background:var(--surface-2); border:1px solid var(--edge);
    color:var(--text); font-family:'Kanit',sans-serif; font-size:13.5px;
    padding:12px 14px; border-radius:10px; margin-bottom:12px;
  }
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    flex:1; padding:12px; border-radius:10px; border:none; cursor:pointer;
    font-family:'Kanit',sans-serif; font-weight:600; font-size:14px;
  }
  .btn-save{background:var(--gold); color:#2c1c07;}
  .btn-cancel{background:var(--surface-2); color:var(--muted); border:1px solid var(--edge) !important;}
</style>
</head>
<body>

<div class="wrap">
  <div class="ticket">
    <div class="shop-title"><span class="coin">3</span> บันทึกยอดขายหน้าบูธ</div>
    <div class="sub">แตะเมนูที่ขายได้ ระบบจะบันทึกลง Google Sheet ให้อัตโนมัติ</div>

    <div class="today-row">
      <div class="stat money">
        <div class="label">ยอดขายวันนี้</div>
        <div class="value" id="todayTotal">–</div>
      </div>
      <div class="stat count">
        <div class="label">จำนวนออเดอร์</div>
        <div class="value" id="todayCount">–</div>
      </div>
    </div>

    <div class="status-line">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">กำลังเชื่อมต่อ…</span>
      <span class="pending-pill" id="pendingPill"><span class="spin"></span><span id="pendingCount">0</span> รอซิงค์</span>
      <button class="settings-btn" id="settingsBtn">⚙ ตั้งค่า</button>
    </div>
  </div>

  <h2 class="section-label">เมนู — แตะเพื่อบันทึกการขาย</h2>
  <div class="grid" id="menuGrid"></div>

  <div class="log-header">
    <h2 class="section-label" style="margin:0;flex:1;">รายการล่าสุด</h2>
    <button class="delete-btn" id="deleteBtn">🗑 ลบที่เลือก (<span id="deleteCount">0</span>)</button>
  </div>
  <div class="log" id="logList">
    <div class="empty">ยังไม่มีข้อมูล</div>
  </div>
</div>

<div class="pop" id="pop"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>ตั้งค่าการเชื่อมต่อ</h3>
    <p>วาง URL ของ Google Apps Script Web App (ลงท้ายด้วย <code>/exec</code>) ที่ได้จากขั้นตอน Deploy</p>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">ยกเลิก</button>
      <button class="btn-save" id="saveBtn">บันทึก</button>
    </div>
  </div>
</div>

<script>
const IMG = {"chicken":"","chicken_rice":"","mojito":"","set":"","pepper_bottle":"","pepper_6pack":""};
/* NOTE: ในไฟล์จริงของคุณ ให้แทนที่บรรทัดด้านบนด้วยชุด IMG base64 เดิมที่มีอยู่แล้ว
   (ผมตัดออกในตัวอย่างนี้เพื่อให้โค้ดอ่านง่าย ไม่ได้เปลี่ยนแปลงส่วนรูปภาพใดๆ) */

const MENU = [
  { name: "ไก่ตื่น", price: 59, cat: "chicken", img: IMG.chicken },
  { name: "ไก่ตื่น + ข้าวเหนียว", price: 69, cat: "chicken", img: IMG.chicken_rice },
  { name: "น้ำ Pepper Mojito", price: 59, cat: "drink", img: IMG.mojito, wide: true },
  { name: "เซตไก่ตื่นข้าวเหนียว + Pepper Mojito", price: 99, cat: "chicken", img: IMG.set, wide: true },
  { name: "พริกไทยตราสามเหรียญ (ขวด)", price: 25, cat: "spice", img: IMG.pepper_bottle },
  { name: "พริกไทยตราสามเหรียญ (ครึ่งโหล)", price: 125, cat: "spice", img: IMG.pepper_6pack },
];

let webAppUrl = null;

// ===== state =====
// serverEntries / serverTodayTotal / serverTodayCount = ความจริงล่าสุดจาก Google Sheet
// localEntries = รายการที่แตะในเครื่องนี้แต่ "ยังไม่ยืนยันว่ามีอยู่ใน Sheet แล้ว"
//   แต่ละอันมี localId ไว้กันซ้ำ และ posted บอกว่าส่ง POST สำเร็จหรือยัง (แต่ยังไม่ถูกยืนยันจาก GET)
let serverEntries = [];
let serverTodayTotal = 0;
let serverTodayCount = 0;
let localEntries = [];

const grid = document.getElementById('menuGrid');
const pop = document.getElementById('pop');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const pendingPill = document.getElementById('pendingPill');
const pendingCountEl = document.getElementById('pendingCount');
const overlay = document.getElementById('overlay');
const urlInput = document.getElementById('urlInput');
const deleteBtn = document.getElementById('deleteBtn');
const deleteCount = document.getElementById('deleteCount');

function renderMenu(){
  grid.innerHTML = '';
  MENU.forEach((item) => {
    const btn = document.createElement('button');
    btn.className = `item-btn cat-${item.cat}` + (item.wide ? ' wide' : '');
    btn.style.backgroundImage = `url('${item.img}')`;
    btn.innerHTML = `
      <span class="tag"></span>
      <span class="overlay-grad"></span>
      <span class="content">
        <span class="name">${item.name}</span>
        <span class="price">${item.price}</span>
      </span>`;
    btn.addEventListener('click', () => logSale(item));
    grid.appendChild(btn);
  });
}

function showPop(msg, isErr){
  pop.textContent = msg;
  pop.className = 'pop show' + (isErr ? ' err' : '');
  setTimeout(() => pop.classList.remove('show'), 1800);
}

function setStatus(state, text){
  statusDot.className = 'dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
  statusText.textContent = text;
}

function nowTimeLabel(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

function genLocalId(){
  return Date.now() + '-' + Math.random().toString(36).slice(2, 9);
}

// ===== storage (persists across reloads; falls back to localStorage if not
// running as a Claude artifact with window.storage) =====
const store = {
  async get(key){
    if (window.storage){
      try { const r = await window.storage.get(key, false); return r ? r.value : null; }
      catch (e) { return null; }
    }
    try { return window.localStorage.getItem(key); } catch (e) { return null; }
  },
  async set(key, val){
    if (window.storage){ return window.storage.set(key, val, false); }
    try { window.localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }
};

async function saveLocalEntries(){
  try { await store.set('localEntries', JSON.stringify(localEntries)); } catch (e) { /* ignore */ }
}
async function loadLocalEntries(){
  try {
    const raw = await store.get('localEntries');
    if (raw) localEntries = JSON.parse(raw);
  } catch (e) { localEntries = []; }
}

// ===== fetch with timeout so a slow connection doesn't hang forever =====
async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    return res;
  } finally {
    clearTimeout(timer);
  }
}

// ===== main flow =====
async function loadUrl(){
  await loadLocalEntries();
  renderCombined();

  const val = await store.get('appsScriptUrl');
  if (val) webAppUrl = val;

  if (!webAppUrl){
    setStatus('err', 'ยังไม่ได้ตั้งค่า URL');
    openSettings();
  } else {
    urlInput.value = webAppUrl;
    refreshData();
    trySendPending();
    setInterval(refreshData, 25000);   // ดึงข้อมูลจริงจาก Sheet เป็นรอบ ไม่ถี่เกินไป
    setInterval(trySendPending, 5000); // retry รายการที่ยังส่งไม่สำเร็จ
  }
}

async function saveUrl(){
  const val = urlInput.value.trim();
  if (!val.startsWith('https://script.google.com/')){
    showPop('URL ดูไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง', true);
    return;
  }
  try {
    await store.set('appsScriptUrl', val);
    webAppUrl = val;
    overlay.classList.remove('show');
    showPop('บันทึก URL แล้ว');
    refreshData();
    trySendPending();
  } catch (e) {
    showPop('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง', true);
  }
}

function openSettings(){ overlay.classList.add('show'); }

// แตะเมนู -> ขึ้นจอทันที ไม่รอเน็ต แล้วค่อยส่งเบื้องหลัง
function logSale(item){
  if (!webAppUrl){ openSettings(); return; }

  const entry = {
    localId: genLocalId(),
    name: item.name,
    price: item.price,
    time: nowTimeLabel(),
    posted: false,
  };
  localEntries.unshift(entry);
  saveLocalEntries();
  renderCombined();
  showPop(`บันทึก "${item.name}" แล้ว ✓`);

  trySendPending();
}

// ส่งรายการที่ยังไม่ยืนยันไป Google Sheet เบื้องหลัง มี timeout กันค้าง
async function trySendPending(){
  if (!webAppUrl) return;
  const toSend = localEntries.filter(e => !e.posted);
  if (toSend.length === 0){ updatePendingIndicator(); return; }

  for (const entry of toSend){
    try {
      await fetchWithTimeout(webAppUrl, {
        method: 'POST',
        body: JSON.stringify({ name: entry.name, price: entry.price, localId: entry.localId })
      }, 8000);
      entry.posted = true;
    } catch (e) {
      // ส่งไม่สำเร็จ (เน็ตช้า/หลุด) - จะลองใหม่รอบถัดไปอัตโนมัติ ไม่ต้องแจ้งเตือนรบกวน
    }
  }
  saveLocalEntries();
  updatePendingIndicator();
}

function updatePendingIndicator(){
  const unsent = localEntries.filter(e => !e.posted).length;
  if (unsent > 0){
    pendingCountEl.textContent = unsent;
    pendingPill.classList.add('show');
  } else {
    pendingPill.classList.remove('show');
  }
}

async function refreshData(){
  if (!webAppUrl) return;
  try {
    const res = await fetchWithTimeout(webAppUrl, { method: 'GET' }, 10000);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'unknown');

    serverEntries = data.entries || [];
    serverTodayTotal = data.todayTotal || 0;
    serverTodayCount = data.todayCount || 0;

    // เอารายการที่ตอนนี้ Sheet มีแล้ว (ยืนยันด้วย localId ตรงกัน) ออกจาก localEntries
    const confirmedIds = new Set(serverEntries.map(e => e.localId).filter(Boolean));
    localEntries = localEntries.filter(e => !confirmedIds.has(e.localId));
    saveLocalEntries();

    setStatus('ok', 'เชื่อมต่อ Google Sheet แล้ว');
    renderCombined();
    updatePendingIndicator();
  } catch (e) {
    setStatus('err', 'เชื่อมต่อไม่ได้ — ตรวจสอบเน็ต/URL');
    // ไม่ล้างข้อมูลที่แสดงอยู่ เพื่อไม่ให้จอกระพริบตอนเน็ตสะดุดแป๊บเดียว
  }
}

// รวมรายการฝั่งเครื่อง (ยังไม่ยืนยัน) + รายการจริงจาก Sheet มาแสดงเป็นชุดเดียว
function renderCombined(){
  const totalToday = serverTodayTotal + localEntries.reduce((s, e) => s + e.price, 0);
  const countToday = serverTodayCount + localEntries.length;

  document.getElementById('todayTotal').textContent = totalToday.toLocaleString() + ' ฿';
  document.getElementById('todayCount').textContent = countToday;

  renderLog();
}

let selectedRows = new Set();

function renderLog(){
  const el = document.getElementById('logList');
  const hasAny = localEntries.length > 0 || serverEntries.length > 0;

  if (!hasAny){
    el.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>';
    selectedRows = new Set();
    updateDeleteBtn();
    return;
  }

  const pendingHtml = localEntries.map(e => `
    <div class="log-row pending">
      <span class="checkbox-spacer"></span>
      <span class="time">${e.time}</span>
      <span class="lname">${e.name}</span>
      <span class="lprice">${Number(e.price).toLocaleString()} ฿</span>
      <span class="sync-spin" title="กำลังซิงค์"></span>
    </div>
  `).join('');

  const confirmedHtml = serverEntries.map(r => `
    <div class="log-row" data-row="${r.row}">
      <input type="checkbox" data-row="${r.row}">
      <span class="time">${r.time}</span>
      <span class="lname">${r.name}</span>
      <span class="lprice">${Number(r.price).toLocaleString()} ฿</span>
    </div>
  `).join('');

  el.innerHTML = pendingHtml + confirmedHtml;

  // คงสถานะติ๊กเลือกไว้ (สำหรับรายการที่ยืนยันแล้วเท่านั้น ลบได้เฉพาะรายการที่มีอยู่จริงใน Sheet)
  el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    const row = Number(cb.dataset.row);
    if (selectedRows.has(row)){
      cb.checked = true;
      cb.closest('.log-row').classList.add('checked');
    }
    cb.addEventListener('change', () => {
      const rowEl = cb.closest('.log-row');
      if (cb.checked){ selectedRows.add(row); rowEl.classList.add('checked'); }
      else { selectedRows.delete(row); rowEl.classList.remove('checked'); }
      updateDeleteBtn();
    });
  });
}

function updateDeleteBtn(){
  deleteCount.textContent = selectedRows.size;
  deleteBtn.classList.toggle('show', selectedRows.size > 0);
}

async function deleteSelected(){
  if (!webAppUrl || selectedRows.size === 0) return;
  const rows = Array.from(selectedRows);
  deleteBtn.disabled = true;
  try {
    await fetchWithTimeout(webAppUrl, {
      method: 'POST',
      body: JSON.stringify({ action: 'delete', rows })
    }, 10000);
    showPop(`ลบ ${rows.length} รายการแล้ว`);
    selectedRows = new Set();
    await refreshData();
  } catch (e) {
    showPop('ลบไม่สำเร็จ ลองใหม่อีกครั้ง', true);
  } finally {
    deleteBtn.disabled = false;
  }
}

document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('cancelBtn').addEventListener('click', () => overlay.classList.remove('show'));
document.getElementById('saveBtn').addEventListener('click', saveUrl);
deleteBtn.addEventListener('click', deleteSelected);

renderMenu();
loadUrl();
</script>
</body>
</html>
